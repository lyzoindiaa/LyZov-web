<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#040303"/>
    </linearGradient>
    <linearGradient id="divineGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="sunHalo" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bgGrad2)"/>
  <circle cx="300" cy="340" r="240" fill="url(#sunHalo)"/>

  <!-- Halo Mandorla Ring -->
  <circle cx="300" cy="320" r="160" fill="none" stroke="url(#divineGold)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="300" cy="320" r="140" fill="none" stroke="url(#divineGold)" stroke-width="1.5" opacity="0.4"/>

  <!-- Sacred Idol Silhouette (Ganesha / Spiritual Motif) -->
  <g transform="translate(300, 320)" fill="url(#divineGold)" stroke="#B45309" stroke-width="1.5">
    <!-- Mukut / Crown -->
    <path d="M-30,-120 L0,-175 L30,-120 L15,-100 L-15,-100 Z"/>
    <circle cx="0" cy="-182" r="6" fill="#FDE68A"/>
    <!-- Head / Ears -->
    <ellipse cx="-45" cy="-60" rx="35" ry="45" opacity="0.9"/>
    <ellipse cx="45" cy="-60" rx="35" ry="45" opacity="0.9"/>
    <ellipse cx="0" cy="-65" rx="42" ry="42"/>
    <!-- Tilak -->
    <path d="M-8,-90 Q0,-105 8,-90 Q0,-75 -8,-90 Z" fill="#EF4444" stroke="#DC2626"/>
    <line x1="-12" y1="-80" x2="12" y2="-80" stroke="#FDE68A" stroke-width="2"/>
    <!-- Trunk -->
    <path d="M-15,-40 C-10,-10 -5,25 -25,45 C-45,65 -50,45 -35,35" fill="none" stroke="url(#divineGold)" stroke-width="18" stroke-linecap="round"/>
    <!-- Modak in Left Hand -->
    <circle cx="65" cy="20" r="12" fill="#FDE68A"/>
    <!-- Body & Lotus Base -->
    <path d="M-60,50 Q-80,95 0,110 Q80,95 60,50 Q0,40 -60,50 Z" opacity="0.95"/>
    <path d="M-110,120 Q0,100 110,120 Q120,150 0,155 Q-120,150 -110,120 Z" fill="url(#divineGold)"/>
  </g>
</svg>
