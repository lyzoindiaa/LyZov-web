<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bgGrad1)"/>
  <circle cx="300" cy="350" r="220" fill="#F59E0B" opacity="0.05" filter="blur(40px)"/>
  
  <!-- Dumbbell / Weight Graphics -->
  <g transform="translate(300, 360)">
    <!-- Barbell Bar -->
    <rect x="-180" y="-12" width="360" height="24" rx="6" fill="url(#metalGrad)"/>
    <!-- Center Grip Knurling -->
    <rect x="-60" y="-14" width="120" height="28" rx="4" fill="#64748b" opacity="0.8"/>
    <!-- Left Inner Collar -->
    <rect x="-140" y="-35" width="16" height="70" rx="4" fill="url(#goldGrad)"/>
    <!-- Left Heavy Plate -->
    <rect x="-175" y="-120" width="30" height="240" rx="12" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="4"/>
    <rect x="-165" y="-100" width="10" height="200" rx="4" fill="#0f172a"/>
    <!-- Left Outer Plate -->
    <rect x="-205" y="-95" width="24" height="190" rx="10" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <!-- Right Inner Collar -->
    <rect x="124" y="-35" width="16" height="70" rx="4" fill="url(#goldGrad)"/>
    <!-- Right Heavy Plate -->
    <rect x="145" y="-120" width="30" height="240" rx="12" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="4"/>
    <rect x="155" y="-100" width="10" height="200" rx="4" fill="#0f172a"/>
    <!-- Right Outer Plate -->
    <rect x="181" y="-95" width="24" height="190" rx="10" fill="#334155" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Kettlebell silhouette watermark -->
  <path d="M260,540 C260,510 275,480 300,480 C325,480 340,510 340,540 L340,560 C370,570 390,600 390,635 C390,680 350,710 300,710 C250,710 210,680 210,635 C210,600 230,570 260,560 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.3"/>
  <rect x="280" y="505" width="40" height="35" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.3"/>
</svg>
