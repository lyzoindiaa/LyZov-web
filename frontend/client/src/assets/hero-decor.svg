<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="brassGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="flameLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#F97316" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#EF4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bgGrad3)"/>

  <!-- Warm ambient light glow -->
  <circle cx="250" cy="220" r="140" fill="url(#flameLight)"/>
  <circle cx="450" cy="200" r="160" fill="url(#flameLight)"/>
  <circle cx="650" cy="220" r="140" fill="url(#flameLight)"/>

  <!-- Left Diya -->
  <g transform="translate(250, 240)">
    <path d="M-50,0 Q0,35 50,0 Q60,-20 0,-15 Q-60,-20 -50,0 Z" fill="url(#brassGlow)" stroke="#B45309" stroke-width="2"/>
    <ellipse cx="0" cy="25" rx="30" ry="10" fill="url(#brassGlow)"/>
    <!-- Flame -->
    <path d="M0,-15 C-12,-35 -10,-60 0,-85 C10,-60 12,-35 0,-15 Z" fill="#FDE047"/>
    <path d="M0,-15 C-6,-28 -5,-45 0,-60 C5,-45 6,-28 0,-15 Z" fill="#FFFFFF"/>
  </g>

  <!-- Center Big Royal Deepam -->
  <g transform="translate(450, 210)">
    <path d="M-80,0 Q0,50 80,0 Q90,-28 0,-22 Q-90,-28 -80,0 Z" fill="url(#brassGlow)" stroke="#92400E" stroke-width="2.5"/>
    <ellipse cx="0" cy="38" rx="55" ry="14" fill="url(#brassGlow)"/>
    <rect x="-12" y="38" width="24" height="60" rx="4" fill="url(#brassGlow)"/>
    <ellipse cx="0" cy="98" rx="45" ry="12" fill="url(#brassGlow)"/>
    <!-- Center Big Flame -->
    <path d="M0,-22 C-18,-50 -15,-85 0,-120 C15,-85 18,-50 0,-22 Z" fill="#FDE047"/>
    <path d="M0,-22 C-8,-38 -7,-65 0,-85 C7,-65 8,-38 0,-22 Z" fill="#FFFFFF"/>
  </g>

  <!-- Right Diya -->
  <g transform="translate(650, 240)">
    <path d="M-50,0 Q0,35 50,0 Q60,-20 0,-15 Q-60,-20 -50,0 Z" fill="url(#brassGlow)" stroke="#B45309" stroke-width="2"/>
    <ellipse cx="0" cy="25" rx="30" ry="10" fill="url(#brassGlow)"/>
    <!-- Flame -->
    <path d="M0,-15 C-12,-35 -10,-60 0,-85 C10,-60 12,-35 0,-15 Z" fill="#FDE047"/>
    <path d="M0,-15 C-6,-28 -5,-45 0,-60 C5,-45 6,-28 0,-15 Z" fill="#FFFFFF"/>
  </g>
</svg>
